name: worfair

# Ambiente de desenvolvimento local — Worfair (Monolito Modular)
# Uso:  cp .env.example .env  (opcional)  →  docker compose up -d
# Painéis: RabbitMQ http://localhost:15672 (worfair / worfair_dev_password)

services:
  postgres:
    image: postgres:16-alpine
    container_name: worfair-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worfair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worfair_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-worfair}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro   # schemas + roles (worfair_app/migrator)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worfair} -d ${POSTGRES_DB:-worfair}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: worfair-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-worfair}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-worfair_dev_password}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Painel de gerenciamento
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Api/Worfair.Api/Dockerfile
    container_name: worfair-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # SOMENTE dev: em staging/produção as migrations rodam como passo controlado (docs/devops/02)
      DB_AUTO_MIGRATE: "true"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-worfair};Username=worfair_app;Password=${APP_DB_PASSWORD:-worfair_app_dev_password}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-worfair}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-worfair_dev_password}
      Jwt__Issuer: ${JWT_ISSUER:-https://worfair.local}
      Jwt__Audience: ${JWT_AUDIENCE:-worfair-web}
      Jwt__PublicKeyPath: /run/secrets/jwt_public.pem
      Jwt__PrivateKeyPath: /run/secrets/jwt_private.pem
      Asaas__BaseUrl: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      Asaas__ApiKey: ${ASAAS_API_KEY:-}
      TZ: America/Sao_Paulo
    ports:
      - "5000:8080"
    volumes:
      - ./dev/jwt:/run/secrets:ro          # chaves JWT RSA de desenvolvimento (RS256, docs/security/01)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: executa migrations contra o banco local (worfair_migrator, BYPASSRLS)
  migrate:
    build:
      context: .
      dockerfile: src/Api/Worfair.Api/Dockerfile
    container_name: worfair-migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-worfair};Username=worfair_migrator;Password=${MIGRATOR_DB_PASSWORD:-worfair_migrator_dev_password}
      DB_MIGRATE_ONLY: "true"
    command: ["dotnet", "Worfair.Api.dll"]

  # Frontend (React + Vite) — dev server com hot reload
  frontend:
    image: node:22-alpine
    container_name: worfair-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./worfair-web:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

  # E-mails de desenvolvimento (módulo Notifications) — painel em http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: worfair-mailhog
    profiles: ["tools"]
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # UI
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data: